# The Loom bundle patch: one deployment, one continuous agent.
#
# Layered over `@deepseek-ai/dsh-base`, which supplies the standard stack (llm, session,
# agent, agent-loop, tools, system-prompt, sandbox, skills, compaction, credentials). This
# patch adds only what makes that stack one long-lived agent instead of a CLI session.
#
# Two kinds of entry below: a top-level `id` row patches that base row in place (its whole
# `config` is replaced, not merged, so each restates its complete configuration), and
# `insert` adds rows base does not have.
#
# Paths live under the DSH home: one home is one deployment, so the agent's workspace and
# runtime state sit beside its sessions and credentials.

# Loom's durable local state is routed to sqlite; base's own domains stay on json. The
# accepted-input ledger only grows and is point-queried per inbound message, which neither
# json layout (whole-file rewrite, or one file per record) suits.
- id: storage-domain
  config:
    backend: json
    routes:
      loom_runtime_state: sqlite

# The agent's file tools are rooted in its own workspace, not the launching cwd.
- id: fs-sandbox
  config:
    cwd: !!js dshHomePath('loom/workspace')

# Open the session-query index so the agent can search its own past generations. base ships
# this row closed (openAt: never, :memory:), which keeps exact reads, filters, and lineage
# traces available while searchSessions/searchEvents fail with SESSION_QUERY_SEARCH_DISABLED.
# Loom's context_search needs search, so open the index lazily — first-search defers the
# node:sqlite import and the whole index build to the first query — over a durable file beside
# the runtime state; an ephemeral :memory: index would rebuild the whole thing on every start.
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('loom/session-query.db')
    openAt: first-search

# Drop base's task-execution scaffolding. It equips a coding agent working a bounded task;
# Loom is a continuous individual, and these tools plus their prompt sections are noise here.
# Subagents stay: spawning helpers is a general capability, not task scaffolding.
- id: plan-mode
  disabled: true
- id: goal
  disabled: true
- id: goal-round-driver
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-ralph
  disabled: true

# A private long-term individual emits no session telemetry. base mounts session-telemetry-otel
# pointing at a DeepSeek endpoint and releases records (with context) on explicit feedback. Loom
# wires no feedback surface, so it never fires today — disabled so it cannot start if one is added.
- id: session-telemetry-otel
  disabled: true

# Two more outbound payloads ride the official DeepSeek request itself: the active plugin-package
# inventory and an incremental copy of the canonical session log. Both are provider metadata
# outside the model's input — no tokens, no KV-cache effect — and both exist for the endpoint's
# own request diagnostics, which is a benefit Loom's deployment does not owe anyone. The session
# log is the fuller disclosure of the two: it is the whole event log, not the messages the model
# is already sent. Loom is one private individual, so neither goes out. DSH_TELEMETRY_DISABLED
# does not cover these; it only hard-disables the telemetry row above.
- id: session-log-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true

# Who the agent is, is the agent's own business. `dsh-system-prompt` ships a harness-identity
# section ("You are an AI agent powered by DeepSeek Harness.") that is on by default, and base
# keeps the deployment persona empty. Both would put the harness's words in the agent's mouth:
# Loom's identity is maintained by the agent itself in `workspace/identity/identity.md`, and
# resident-context reads it into every turn. Turning the harness section off leaves that file as
# the only source of self-description. The persona fields stay restated because a row patch
# replaces the whole config rather than merging it.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ''
    personaSuffix: ''

# Move the agent's whole model-facing surface to the agent plane.
#
# Base mounts these rows globally as the default for a deployment that has no opinion. Loom has
# one: `presets/loom.patch.yml` names exactly what this agent can do. Disabling them here
# is the other half of that — a row left enabled would sit in the global layer, which every agent
# inherits, so it would reach the model without appearing in the preset.
#
# What stays enabled is the host plane the preset resolves against: the `tools`, `skill`, `web`,
# and `subagents` registries, the shell and sandbox stack, persistence, and the model route.
# Same split as `dsh-web-app`, for the same reason.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-web
  disabled: true
- id: tool-workflow
  disabled: true
- id: agent-instructions
  disabled: true
- id: compaction-basic
  disabled: true
- id: command-compact
  disabled: true
- id: tool-result-pruner
  disabled: true

- insert:
    # The agent-plane roster. Loom ships exactly one preset and its agent always joins it, so
    # the shipped and user roots stay off: this deployment's composition is not something a
    # user edits, and an empty session must never fall back to another product's preset.
    #
    # The root path is derived from the profile directory the loader resolves this patch
    # against, which is where the `loom` package is installed.
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: loom

    # The sqlite medium behind the routed domain above.
    - id: storage-sqlite
      name: '@deepseek-ai/dsh-storage-sqlite'
      config:
        path: !!js dshHomePath('loom/runtime-state.db')

    # A logger sink, mounted first so it captures everything after it. base collects ctx.logger
    # into an in-memory ring buffer with no output; this writes each message to stderr, which the
    # systemd service captures in the journal. Without it a broken channel poll or failed turn
    # leaves no trace.
    - id: log
      name: 'loom/log'

    # The single time source. Everything that needs "now" reads it here, so behavior eval
    # can drive time deterministically.
    - id: clock
      name: 'loom/clock'

    # Durable current-session pointer and accepted-input ledger.
    - id: runtime-state
      name: 'loom/runtime-state'

    # Harness mechanics as a system-prompt section, just after the deployment persona
    # prefix. Who the agent is stays out of it: base leaves `personaPrefix` empty and
    # identity lives in the workspace's identity.md, which the agent itself maintains.
    - id: orientation
      name: 'loom/orientation'

    # The agent's resident context: identity, memory, threads, and attention are read fresh into
    # every turn, and a write-budget observer flags a resident file the moment a write fills it
    # toward its cap. The agent maintains every one of these files with the generic file tools;
    # there is no dedicated memory tool.
    - id: resident-context
      name: 'loom/resident-context'
      config:
        workspace: !!js dshHomePath('loom/workspace')

    # Boots the one agent (resume the pointed-to session, or create the first one) and owns
    # every context rollover. Model and provider come from base's default-model plugin, so
    # no agentOptions here.
    - id: agent-runtime
      name: 'loom/agent-runtime'
      config:
        workspace: !!js dshHomePath('loom/workspace')

    # The chat transport seam: normalizes a provider into channel/inbound events and sends
    # outbound. `allow` is the authorization allowlist as `channel:actorId` (or `channel:*`,
    # or `*`); empty admits nobody, so a deployment MUST list who may talk to the agent —
    # e.g. `telegram:123456789`. Left empty here on purpose: unauthenticated access is not a
    # default.
    - id: channel-gateway
      name: '@wowyuarm/dsh-channel-gateway'
      config:
        allow: []

    # Telegram over long polling; the bot token comes from DSH_TELEGRAM_TOKEN. Without a token
    # the channel simply does not register (the adapter logs and returns).
    - id: channel-telegram
      name: '@wowyuarm/dsh-channel-gateway/telegram'

    # Loom's consumer: dedup inbound against the durable ledger, land attachments under the
    # agent's `workspace/media/<channel>/`, deliver each message to the agent as a turn, and
    # expose the message tool so the agent answers (files included) to the conversation in focus.
    # Same workspace as agent-runtime, so incoming files sit where the agent's own tools reach.
    - id: channels
      name: 'loom/channels'
      config:
        workspace: !!js dshHomePath('loom/workspace')
