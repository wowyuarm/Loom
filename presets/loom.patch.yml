# Loom's agent preset: what this agent can actually do.
#
# This is the AGENT PLANE. The `agent-preset-registry` row in `cordis.patch.yml` registers this
# declaration, and Loom's agent joins it at creation (see `agent-runtime`), so every plugin below
# registers into the agent's layer rather than the process-global one.
#
# The host plane (`dsh-base`, plus Loom's own host plugins) keeps what a composition must not
# own: the tool registry, the sandbox and approval stack, persistence, and the model route.
# `cordis.patch.yml` disables base's model-facing rows so this file is the only place the
# agent's surface is decided — adding a tool here is a deliberate act, and a tool base ships
# later cannot reach the agent on its own.
#
# Every row below registers into the host `tools` registry and provides no service, so none
# needs an `isolate` realm except the compaction group, which publishes services.
- insert:
    - id: preset-loom
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: loom
        order: 1
        plugins:
          # ── filesystem ──────────────────────────────────────────────────────────────

          # read, write, edit, read_image, glob, grep — rooted at the agent's workspace.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── shell ───────────────────────────────────────────────────────────────────

          # The shell service and its executors stay host-plane; these rows contribute the tool.
          # One stack mounts per host, so each platform's row gates off the other.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── background jobs ─────────────────────────────────────────────────────────

          # Only the model-facing controls (job_list, job_output, job_kill). The job registry
          # stays host-plane, where `tool-bash`'s `run_in_background` resolves it.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── web ─────────────────────────────────────────────────────────────────────

          # The web service and its search/fetch providers stay host-plane; only the tool is
          # per-agent.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'

          # ── compaction ──────────────────────────────────────────────────────────────

          # The automatic pressure floor: when the context fills, compaction-basic summarizes in
          # place so a turn does not break at the window. This is distinct from context_rollover,
          # which the agent calls deliberately to shed a generation; the two coexist — compaction
          # is the involuntary floor, rollover the deliberate act.
          #
          # These are services, so they need an isolate realm (a preset row publishing into the
          # root realm is rejected at mount). compaction-basic reads the tool-result pruner
          # through ctx.get, so the pruner shares this realm. The token meter is NOT here: it
          # stays host-plane (it owns process-wide projection units), and compaction-basic
          # resolves that one host instance.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
